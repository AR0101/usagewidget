name: build

# Windows binaries cannot be cross-compiled from macOS — WebView2 and the MSVC
# linker both need the real thing — so the installer is produced here instead.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    # Needed only by the release step, but the default token is read-only in
    # repositories configured that way, and the failure surfaces late.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every push leaves a downloadable build, so there is no need to cut a tag
      # just to get a copy onto someone's machine.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UsageWidget-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
